services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-local-dev-password}
      DB_NAME: accounts
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./login-system:/var/www/html

  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-local-dev-password}
    volumes:
      - accounts-db:/var/lib/mysql
      - ./login-system/sql/sql.txt:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$${MYSQL_ROOT_PASSWORD}\" mysqladmin ping -h 127.0.0.1 -uroot --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 120s

volumes:
  accounts-db:
